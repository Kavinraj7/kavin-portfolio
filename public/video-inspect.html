<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Inspection</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 1200px;
      display: block;
      margin: 0 auto;
      border: 1px solid #333;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 8px 16px;
      margin: 4px;
      cursor: pointer;
    }
    #time-display {
      font-family: monospace;
      font-size: 18px;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="seekTo(0)">0s</button>
    <button onclick="seekTo(1)">1s</button>
    <button onclick="seekTo(2)">2s</button>
    <button onclick="seekTo(4)">4s</button>
    <button onclick="seekTo(5)">5s</button>
    <button onclick="seekTo(6)">6s</button>
    <button onclick="seekTo(7)">7s</button>
    <button onclick="seekTo(8)">8s</button>
    <button onclick="seekTo(9)">9s</button>
    <div id="time-display">Time: 0.0s</div>
  </div>
  <video id="v" src="/homepage2nd.mp4" controls preload="auto"></video>
  <script>
    const v = document.getElementById('v');
    const disp = document.getElementById('time-display');
    function seekTo(t) {
      v.currentTime = t;
      disp.innerText = `Time: ${t}s (width: ${v.videoWidth}, height: ${v.videoHeight})`;
    }
    v.addEventListener('timeupdate', () => {
      disp.innerText = `Time: ${v.currentTime.toFixed(2)}s (width: ${v.videoWidth}, height: ${v.videoHeight})`;
    });
  </script>
</body>
</html>
